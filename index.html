<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <script src="./theme.js" defer></script>
    <script src="./input.js" defer></script>
    <title>WebTech</title>
</head>
<body id="light_theme">
    <header>
        <img src="./images/logo.png" alt="" id="logo">
        <img src="./images/DarkButton.png" alt="" id="theme">
    </header>
    <main id="constructor">

        <div id="modal-local">
            <button id="add"><img src="./images/Add.png" alt=""></button>
            <p id="text-modal">Adicionar Item.</p>
        </div>

        <div class="dialog-backdrop-div" style="display: none;"></div>
        <dialog id="form-modal" style="display: none;">
            <div class="group">
                <label for="name">Nome do produto</label>
                <input type="text" id="name" placeholder="Nome do Eletrônico" required>
            </div>
            <div class="group">
                <label for="catego">Categoria</label>
                <select id="catego" required>
                    <option value="Acessorios">Acessórios</option>
                    <option value="Computadores">Computadores</option>
                    <option value="Comunicação">Comunicação</option>
                    <option value="Entretenimento-multimidia">Entretenimento e multimidia</option>
                    <option value="Audio">Áudio</option>
                    <option value="Eletrodomesticos">Eletrodomésticos</option>
                    <option value="Wearables">Wearables</option>
                    <option value="Redes">Redes</option>
                </select>
            </div>
            <div class="group">
                <label for="descrip">Descrição</label>
                <textarea name="descricao" id="descrip" placeholder="Dados do produto" required></textarea>
            </div>
            <div class="subgroup">
            <div class="group">
                <label for="preco">Preço</label>
                <input type="number" name="" id="preco" required>
            </div>
            <div class="group">
                <label for="quantia">Quantidade</label>
                <input type="number" required id="quantia">
            </div>
            </div>
        </dialog>
        <section id="container-local">

        </section>

    </main>

    <footer>
        <a href="https://github.com/arthurm-barros/WebTech" target="_blank"><img src="./images/Footer.png" alt=""></a>
    </footer>
</body>
</html>
